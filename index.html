<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      color: #fff;
      text-align: center;
    }

    header {
      padding: 60px 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      max-width: 600px;
      margin: 0 auto 30px;
    }

    a.button {
      display: inline-block;
      background: #fff;
      color: #5563DE;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 6px;
      transition: 0.3s;
    }

    a.button:hover {
      background: #E0E0E0;
    }

    footer {
      background: rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-top: 50px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hello, I'm Alex!</h1>
    <p>Welcome to my very first website hosted on GitHub Pages 🎉</p>
    <a href="https://github.com/" class="button">Visit my GitHub</a>
  </header>

  <footer>
    <p>© 2025 My First Website — Built with ❤️ using GitHub Pages</p>
  </footer>

</body>
</html>
